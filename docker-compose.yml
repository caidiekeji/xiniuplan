version: '3.8'

services:
  # ==================== 后端服务 ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: cloudpivot-backend:latest
    container_name: cloudpivot-backend
    restart: always
    ports:
      - "8888:8888"
    environment:
      - TZ=Asia/Shanghai
      # 管理员初始密码（首次启动时生效，后续修改以数据库为准）
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    volumes:
      # 持久化数据：SQLite 数据库、JWT 密钥
      - backend-data:/opt/cloudpivot/data
      # 应用定义文件
      - backend-store:/opt/cloudpivot/store
      # 网站文件根目录
      - www-data:/www
      # 挂载 Docker Socket（容器管理、数据库实例等功能必需）
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cloudpivot
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==================== 前端服务 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cloudpivot-frontend:latest
    container_name: cloudpivot-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cloudpivot
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==================== 可选：MySQL ====================
  # 使用 --profile database 启动：
  #   docker compose --profile database up -d
  mysql:
    image: mysql:8.0
    container_name: cloudpivot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cloudpivot}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - cloudpivot
    profiles:
      - database

  # ==================== 可选：Redis ====================
  redis:
    image: redis:7-alpine
    container_name: cloudpivot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - cloudpivot
    profiles:
      - database

# ==================== 数据卷 ====================
volumes:
  backend-data:
    driver: local
  backend-store:
    driver: local
  www-data:
    driver: local
  mysql-data:
    driver: local
  redis-data:
    driver: local

# ==================== 网络 ====================
networks:
  cloudpivot:
    driver: bridge
