version: '3.8'

# 云枢面板 - 单镜像部署
# 一个容器同时提供页面（SPA）与 API/WebSocket，无需独立前端容器。
# 使用 GHCR 镜像：
#   docker compose pull && docker compose up -d
# 或本地构建：
#   docker compose up -d --build

services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/caidiekeji/xiniupanl:latest
    container_name: xiniupanl
    restart: always
    ports:
      - "8888:8888"
    environment:
      - TZ=Asia/Shanghai
      # 管理员初始密码（首次启动时生效，后续修改以数据库为准）
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    volumes:
      # 持久化数据：SQLite 数据库、JWT 密钥、网站文件根目录
      - panel-data:/app/data
      - panel-store:/app/store
      - panel-www:/app/www
      # 挂载 Docker Socket（容器管理、数据库实例等功能必需）
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==================== 可选：MySQL ====================
  # 使用 --profile database 启动：
  #   docker compose --profile database up -d
  mysql:
    image: mysql:8.0
    container_name: xiniupanl-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cloudpivot}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - xiniupanl
    profiles:
      - database

  # ==================== 可选：Redis ====================
  redis:
    image: redis:7-alpine
    container_name: xiniupanl-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - xiniupanl
    profiles:
      - database

# ==================== 数据卷 ====================
volumes:
  panel-data:
    driver: local
  panel-store:
    driver: local
  panel-www:
    driver: local
  mysql-data:
    driver: local
  redis-data:
    driver: local

# ==================== 网络 ====================
networks:
  xiniupanl:
    driver: bridge
