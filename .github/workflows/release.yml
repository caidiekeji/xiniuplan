name: Release

# 打 tag（v*）时构建单文件 Linux 二进制并发布到 GitHub Releases。
# install.sh 从 Releases 下载，因此产物命名必须与 scripts/install.sh 一致：
#   rhinopanel-linux-amd64 / rhinopanel-linux-arm64
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与 CI 及 Dockerfile（node:22-alpine）保持一致；Node 20 无法加载 jsdom 30
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum

      # 前端构建并复制到 embed 目录（backend/web/dist），与 scripts/deploy.py 同一套流程
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy dist into embed dir
        run: |
          rm -rf backend/web/dist
          mkdir -p backend/web/dist
          cp -r frontend/dist/. backend/web/dist/

      - name: Build linux binaries
        working-directory: backend
        run: |
          LDFLAGS="-s -w"
          for ARCH in amd64 arm64; do
            GOOS=linux GOARCH=${ARCH} go build -ldflags="${LDFLAGS}" \
              -o rhinopanel-linux-${ARCH} ./cmd/agent
          done
          ls -lh rhinopanel-linux-*

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            backend/rhinopanel-linux-amd64
            backend/rhinopanel-linux-arm64
