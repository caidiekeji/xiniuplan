version: "3.8"

services:
  app:
    image: jc21/nginx-proxy-manager:2.11
    container_name: npm
    restart: unless-stopped
    ports:
      - "{{NPM_HTTP_PORT}}:80"
      - "{{NPM_PORT}}:81"
      - "{{NPM_HTTPS_PORT}}:443"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt

volumes:
  npm_data:
  npm_letsencrypt:
