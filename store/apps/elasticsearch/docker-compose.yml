version: "3.8"

services:
  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: elasticsearch
    restart: unless-stopped
    ports:
      - "{{ES_PORT}}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "{{ES_JAVA_OPTS}}"
    volumes:
      - es_data:/usr/share/elasticsearch/data

volumes:
  es_data:
