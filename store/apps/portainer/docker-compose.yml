version: "3.8"

services:
  portainer:
    image: portainer/portainer-ce:2.19
    container_name: portainer
    restart: unless-stopped
    ports:
      - "{{PORTAINER_PORT}}:9000"
      - "{{PORTAINER_HTTPS_PORT}}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
