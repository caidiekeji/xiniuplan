version: "3.8"

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    user: root
    ports:
      - "{{JENKINS_PORT}}:8080"
      - "{{JENKINS_AGENT_PORT}}:50000"
    environment:
      JENKINS_OPTS: "{{JENKINS_OPTS}}"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_data:
