# 犀牛面板配置文件
server:
  port: 8888
  mode: debug          # debug | release
  read_timeout: 60
  write_timeout: 60

database:
  path: ./data/cloudpivot.db

jwt:
  key_dir: ./data/jwt
  access_token_ttl: 7200    # 2小时
  refresh_token_ttl: 604800 # 7天

log:
  level: info

monitor:
  interval: 15  # 采集间隔（秒）

site:
  # 站点根目录（相对面板工作目录 backend/）
  root_dir: ./runtime/www
  # nginx 站点配置目录（需被服务器 nginx include 才生效）
  nginx_conf_dir: ./runtime/nginx/conf.d
  # SSL 证书目录
  ssl_dir: ./runtime/ssl
